<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Player Comparison Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1c2537;
  --surface3: #242f45;
  --border: #2a3a55;
  --text: #e8edf5;
  --text2: #8a9bbf;
  --text3: #5a6a8a;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --gold: #f59e0b;
  --green: #10b981;
  --radius: 10px;
  --radius-sm: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#0a0e1a 0%,#0f1e3a 50%,#0a1628 100%);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--blue),#6366f1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.04em;color:#fff}
.header-sub{font-size:11px;color:var(--text2);margin-top:1px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.header-badge{margin-left:auto;background:var(--blue-dim);border:1px solid rgba(59,130,246,0.3);color:var(--blue);font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.04em;white-space:nowrap}

/* LAYOUT */
.main{max-width:1100px;margin:0 auto;padding:20px 16px}

/* FILTERS */
.filter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.filter-section{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filter-section:last-child{margin-bottom:0}
.flabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;min-width:70px}
.pill{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;font-weight:500}
.pill:hover{border-color:var(--blue);color:var(--text)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.fselect{font-size:12px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.fselect:focus{outline:none;border-color:var(--blue)}

/* SEARCH */
.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.sbox-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sbox{position:relative}
.sbox-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none}
.sbox input{width:100%;padding:10px 12px 10px 36px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;transition:border-color .15s;font-family:'Inter',sans-serif}
.sbox input:focus{outline:none;border-color:var(--blue)}
.sbox input::placeholder{color:var(--text3)}
.dd{position:absolute;top:calc(100% + 4px);width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-height:220px;overflow-y:auto;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dd.open{display:block}
.ddi{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);transition:background .1s}
.ddi:last-child{border-bottom:none}
.ddi:hover{background:var(--surface2)}
.ddi-name{font-size:13px;color:var(--text);font-weight:500}
.ddi-meta{font-size:11px;color:var(--text3);display:flex;gap:6px}
.ddi-meta span{background:var(--surface3);padding:1px 6px;border-radius:4px}
.no-results{padding:12px 14px;font-size:13px;color:var(--text3);text-align:center}

/* PLAYER CARDS */
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.pcard.p1::before{background:linear-gradient(90deg,var(--blue),#6366f1)}
.pcard.p2::before{background:linear-gradient(90deg,var(--red),#f97316)}
.pcard-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;gap:8px;color:var(--text3)}
.pcard-empty .ei{font-size:32px;opacity:.4}
.pcard-empty p{font-size:13px}
.pcard-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}
.av1{background:linear-gradient(135deg,#1e3a6e,#2563eb);color:#93c5fd}
.av2{background:linear-gradient(135deg,#6e1e1e,#dc2626);color:#fca5a5}
.pname{font-size:16px;font-weight:700;color:var(--text);font-family:'Barlow Condensed',sans-serif;letter-spacing:.03em}
.pmeta{font-size:11px;color:var(--text2);margin-top:2px}
.conf-tag{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:4px;font-size:10px;font-weight:600;padding:1px 5px;color:var(--text3);margin-left:4px;letter-spacing:.03em}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sc{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 10px;border:1px solid var(--border)}
.sc-lbl{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.sc-val{font-size:18px;font-weight:700;color:var(--text);margin-top:2px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
.sc-val.blue{color:var(--blue)}
.sc-val.gold{color:var(--gold)}

/* COMPARISON SECTION */
.cmp-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.cmp-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cmp-title::after{content:'';flex:1;height:1px;background:var(--border)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px;font-weight:500}
.ldot{width:10px;height:10px;border-radius:3px}

/* BARS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar-val{font-size:13px;font-weight:700;width:30px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:15px}
.bvl{color:var(--blue)}
.bvr{color:var(--red)}
.bar-center{flex:1}
.bar-lbl{font-size:11px;color:var(--text3);text-align:center;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.bbar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;display:flex}
.bl{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:99px 0 0 99px;transition:width .4s ease}
.br2{height:100%;background:linear-gradient(90deg,#f97316,#ef4444);border-radius:0 99px 99px 0;margin-left:auto;transition:width .4s ease}

/* CHARTS */
.chart-wrap{position:relative;height:260px;width:100%}

/* TABLE */
.match-table{width:100%;border-collapse:collapse;font-size:12px}
.match-table th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);color:var(--text3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.match-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text)}
.match-table tr:last-child td{border-bottom:none}
.match-table tr:hover td{background:var(--surface2)}
.win{color:var(--green);font-weight:700}.draw{color:var(--gold);font-weight:700}.loss{color:var(--red);font-weight:700}
.sep-col{border-left:1px solid var(--border) !important}
.empty-cmp{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.empty-cmp .ei2{font-size:36px;margin-bottom:8px;opacity:.3}

/* STATS DIVIDER */
.stats-divider{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text3);font-weight:600;margin-bottom:14px;padding:8px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}

/* FOOTER */
.footer{text-align:center;padding:24px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:8px}
.footer a{color:var(--blue);text-decoration:none}

/* PLAYER COUNT BADGE */
.pcount{background:var(--surface3);border:1px solid var(--border);border-radius:99px;font-size:11px;color:var(--text2);padding:3px 10px;font-weight:500}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* RESPONSIVE */
@media(max-width:640px){
  .search-grid,.pcards{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .header-badge{display:none}
}
</style>
</head>
<body>

<header class="header" role="banner">
  <div class="header-icon">⚽</div>
  <div>
    <div class="header-title">FIFA WC 2026 — Player Stats</div>
    <div class="header-sub">Comparison Model · All 48 Nations</div>
  </div>
  <div class="header-badge">🏆 1,000+ Players</div>
</header>

<main class="main" id="main">

  <!-- FILTERS -->
  <div class="filter-card" role="region" aria-label="Filters">
    <div class="filter-section">
      <span class="flabel">Position</span>
      <button class="pill on" onclick="setPos(this,'All')">All</button>
      <button class="pill" onclick="setPos(this,'FW')">FW</button>
      <button class="pill" onclick="setPos(this,'MF')">MF</button>
      <button class="pill" onclick="setPos(this,'DF')">DF</button>
      <button class="pill" onclick="setPos(this,'GK')">GK</button>
      <span class="pcount" id="player-count" aria-live="polite">Loading…</span>
    </div>
    <div class="filter-section">
      <span class="flabel">Confed.</span>
      <button class="pill on" id="conf-all" onclick="setConf(this,'All')">All</button>
      <button class="pill" onclick="setConf(this,'UEFA')">🇪🇺 UEFA</button>
      <button class="pill" onclick="setConf(this,'CONMEBOL')">🌎 CONMEBOL</button>
      <button class="pill" onclick="setConf(this,'CONCACAF')">🌍 CONCACAF</button>
      <button class="pill" onclick="setConf(this,'AFC')">🌏 AFC</button>
      <button class="pill" onclick="setConf(this,'CAF')">🌍 CAF</button>
    </div>
    <div class="filter-section">
      <span class="flabel">Team</span>
      <select class="fselect" id="team-sel" onchange="render()"><option value="">All teams</option></select>
      <span class="flabel" style="margin-left:12px">Sort by</span>
      <select class="fselect" id="sort-sel" onchange="render()">
        <option value="rating">Avg Rating</option>
        <option value="goals">Total Goals</option>
        <option value="assists">Total Assists</option>
        <option value="shots">Shots/Game</option>
        <option value="passes">Passes/Game</option>
      </select>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-grid">
    <div>
      <div class="sbox-label">Player 1 (Blue)</div>
      <div class="sbox" id="sb1">
        <span class="sbox-icon" aria-hidden="true">🔍</span>
        <input type="text" id="i1" placeholder="Search by name or team…" oninput="doSearch(1)" onfocus="doSearch(1)" autocomplete="off" aria-label="Search player 1" aria-autocomplete="list" aria-controls="dd1">
        <div class="dd" id="dd1" role="listbox" aria-label="Player 1 suggestions"></div>
      </div>
    </div>
    <div>
      <div class="sbox-label">Player 2 (Red)</div>
      <div class="sbox" id="sb2">
        <span class="sbox-icon" aria-hidden="true">🔍</span>
        <input type="text" id="i2" placeholder="Search by name or team…" oninput="doSearch(2)" onfocus="doSearch(2)" autocomplete="off" aria-label="Search player 2" aria-autocomplete="list" aria-controls="dd2">
        <div class="dd" id="dd2" role="listbox" aria-label="Player 2 suggestions"></div>
      </div>
    </div>
  </div>

  <!-- PLAYER CARDS -->
  <div class="pcards" id="pcards"></div>

  <!-- COMPARISON -->
  <div id="cmp-area"></div>

</main>

<footer class="footer">
  FIFA World Cup 2026 Player Comparison Model · Stats are simulated per match history for all 48 nations
</footer>

    {n:'Gareth Bale',pos:'FW'},{n:'Daniel James',pos:'FW'},{n:'Kieffer Moore',pos:'FW'},{n:'Brennan Johnson',pos:'FW'},{n:'Mark Harris',pos:'FW'},{n:'Rabbi Matondo',pos:'FW'},{n:'Tyler Roberts',pos:'FW'},{n:'Tom Lawrence',pos:'FW'},{n:'David Brooks',pos:'FW'},{n:'Jonny Williams',pos:'MF'}]},
  {name:'Austria',conf:'UEFA',players:[
    {n:'Patrick Pentz',pos:'GK'},{n:'Alexander Schlager',pos:'GK'},{n:'Paul Gartler',pos:'GK'},
    {n:'Stefan Posch',pos:'DF'},{n:'Aleksandar Dragovic',pos:'DF'},{n:'Christopher Trimmel',pos:'DF'},{n:'Phillipp Lienhart',pos:'DF'},{n:'Maximilian Wober',pos:'DF'},{n:'David Alaba',pos:'DF'},{n:'Andreas Ulmer',pos:'DF'},
    {n:'Florian Grillitsch',pos:'MF'},{n:'Marcel Sabitzer',pos:'MF'},{n:'Xaver Schlager',pos:'MF'},{n:'Konrad Laimer',pos:'MF'},{n:'Nicolas Seiwald',pos:'MF'},{n:'Christoph Baumgartner',pos:'MF'},
    {n:'Marko Arnautovic',pos:'FW'},{n:'Michael Gregoritsch',pos:'FW'},{n:'Sasa Kalajdzic',pos:'FW'},{n:'Patrick Wimmer',pos:'FW'},{n:'Romano Schmid',pos:'MF'},{n:'Florian Kainz',pos:'FW'},{n:'Philipp Schobesberger',pos:'FW'},{n:'Christoph Monschein',pos:'FW'},{n:'Ercan Masovic',pos:'DF'},{n:'Stefan Lainer',pos:'DF'}]}
];

const OPPS=['vs France','vs Germany','vs Brazil','vs Argentina','vs Spain','vs England','vs Italy','vs Netherlands','vs Portugal','vs Croatia','vs Morocco','vs Belgium','vs USA','vs Japan','vs Uruguay','vs Colombia'];
const SEASONS=['2025-26','2024-25','2023-24'];
const RESULTS=['W','D','L'];

const STARS={
  'Lionel Messi':0.95,'Kylian Mbappé':0.96,'Cristiano Ronaldo':0.88,'Vinicius Jr.':0.90,
  'Erling Haaland':0.93,'Kevin De Bruyne':0.88,'Lamine Yamal':0.84,'Son Heung-min':0.82,
  'Robert Lewandowski':0.85,'Sadio Mané':0.80,'Victor Osimhen':0.82,'Christian Pulisic':0.74,
  'Florian Wirtz':0.84,'Jamal Musiala':0.85,'Pedri':0.82,'Rodri':0.87,'Jude Bellingham':0.87,
  'Harry Kane':0.87,'Bukayo Saka':0.82,'Mohamed Kudus':0.76,'Alphonso Davies':0.81,
  'Jonathan David':0.79,'Achraf Hakimi':0.80,'André Onana':0.82,'Bruno Fernandes':0.84,
  'Darwin Núñez':0.79,'Cody Gakpo':0.78,'Rasmus Højlund':0.78,'Neymar Jr.':0.83,
  'Toni Kroos':0.85,'Federico Valverde':0.82,'James Rodríguez':0.80,'Luis Díaz':0.79,
  'Rafael Leão':0.80,'Julián Álvarez':0.81,'Gianluigi Donnarumma':0.84,'Thibaut Courtois':0.88,
  'Manual Akanji':0.76,'Takefusa Kubo':0.76,'Kaoru Mitoma':0.78,'Hakim Ziyech':0.77
};

function sRanges(pos){
  return{FW:{goals:[0,3],assists:[0,2],shots:[2,8],passes:[14,44],dribbles:[1,8],rating:[6.2,9.6]},MF:{goals:[0,2],assists:[0,3],shots:[0,5],passes:[42,94],dribbles:[1,5],rating:[6.0,9.1]},DF:{goals:[0,1],assists:[0,1],shots:[0,3],passes:[46,88],dribbles:[0,3],rating:[6.0,8.6]},GK:{goals:[0,0],assists:[0,0],shots:[0,0],passes:[32,58],dribbles:[0,0],rating:[5.8,8.9]}}[pos]||{goals:[0,1],assists:[0,1],shots:[0,3],passes:[35,70],dribbles:[0,3],rating:[6.0,8.0]};
}

let seed=42;
function rng(){seed=(seed*1664525+1013904223)&0xFFFFFFFF;return(seed>>>0)/4294967296;}
function srng(s){seed=s;}
function rr(lo,hi,r){return lo+(hi-lo)*r;}
function lerp(a,b,t){return a+(b-a)*t;}

const DB=[];
let pid=0;
TEAMS.forEach(team=>{
  team.players.forEach(p=>{
    const boost=STARS[p.n]||(0.35+( (p.n.charCodeAt(0)+p.n.length)*7919%100)/300);
    const hash=p.n.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    srng(hash+team.name.length*31+pid*17);
    const sr=sRanges(p.pos);
    const nm=3+Math.floor(rng()*3);
    const ms=[];
    for(let i=0;i<nm;i++){
      ms.push({
        match:OPPS[Math.floor(rng()*OPPS.length)],
        season:SEASONS[Math.floor(rng()*3)],
        result:RESULTS[Math.floor(rng()*3)],
        goals:Math.max(0,Math.round(rr(sr.goals[0],sr.goals[1],rng()*boost))),
        assists:Math.max(0,Math.round(rr(sr.assists[0],sr.assists[1],rng()*boost))),
        shots:Math.max(0,Math.round(rr(sr.shots[0],sr.shots[1],rng()*boost))),
        passes:Math.max(0,Math.round(rr(sr.passes[0],sr.passes[1],0.3+rng()*0.7))),
        dribbles:Math.max(0,Math.round(rr(sr.dribbles[0],sr.dribbles[1],rng()*boost))),
        rating:parseFloat(lerp(sr.rating[0],sr.rating[1],0.25+rng()*boost).toFixed(1))
      });
    }
    DB.push({id:pid++,name:p.n,team:team.name,conf:team.conf,pos:p.pos,matches:ms});
  });
});

let posF='All',confF='All',selP=[null,null];
let rC=null,tC=null;

function initTeamSel(){
  const s=document.getElementById('team-sel');
  [...new Set(DB.map(p=>p.team))].sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;s.appendChild(o);});
}
function getFiltered(){
  const team=document.getElementById('team-sel').value;
  const sort=document.getElementById('sort-sel').value;
  return DB.filter(p=>{
    if(posF!=='All'&&p.pos!==posF)return false;
    if(confF!=='All'&&p.conf!==confF)return false;
    if(team&&p.team!==team)return false;
    return true;
  }).sort((a,b)=>{
    const ga=v=>sort==='rating'?avg(a.matches,v):sort==='goals'?sum(a.matches,v):sort==='assists'?sum(a.matches,v):avg(a.matches,v);
    const gb=v=>sort==='rating'?avg(b.matches,v):sort==='goals'?sum(b.matches,v):sort==='assists'?sum(b.matches,v):avg(b.matches,v);
    const key=sort==='goals'?'goals':sort==='assists'?'assists':sort==='shots'?'shots':sort==='passes'?'passes':'rating';
    return gb(key)-ga(key);
  });
}
function avg(ms,k){return ms.length?ms.reduce((s,m)=>s+m[k],0)/ms.length:0;}
function sum(ms,k){return ms.reduce((s,m)=>s+m[k],0);}

function setPos(btn,p){
  posF=p;
  document.querySelectorAll('.filter-section:first-child .pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  resetSel();render();
}
function setConf(btn,c){
  confF=c;
  document.querySelectorAll('.filter-section:nth-child(2) .pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  resetSel();render();
}
function resetSel(){selP=[null,null];document.getElementById('i1').value='';document.getElementById('i2').value='';}

function doSearch(n){
  const q=document.getElementById('i'+n).value.toLowerCase().trim();
  const list=getFiltered().filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)).slice(0,16);
  const dd=document.getElementById('dd'+n);
  if(!list.length){dd.innerHTML='<div class="no-results">No players found</div>';}
  else{dd.innerHTML=list.map(p=>`<div class="ddi" onmousedown="pick(${n},${p.id})"><span class="ddi-name">${p.name}</span><span class="ddi-meta"><span>${p.team}</span><span>${p.pos}</span></span></div>`).join('');}
  dd.classList.add('open');
}
function pick(n,id){
  selP[n-1]=DB.find(p=>p.id===id);
  document.getElementById('i'+n).value=selP[n-1].name;
  document.getElementById('dd'+n).classList.remove('open');
  render();
}
document.addEventListener('click',e=>{if(!e.target.closest('.sbox'))document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));});

function ini(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

function cardHTML(p,side){
  if(!p)return`<div class="pcard ${side}"><div class="pcard-empty"><div class="ei">👤</div><p>Search ${side==='p1'?'Player 1':'Player 2'} above</p></div></div>`;
  const ms=p.matches;
  const avgR=avg(ms,'rating').toFixed(1);
  return`<div class="pcard ${side}">
    <div class="pcard-top">
      <div class="avatar ${side==='p1'?'av1':'av2'}">${ini(p.name)}</div>
      <div><div class="pname">${p.name}</div><div class="pmeta">${p.team} · ${p.pos}<span class="conf-tag">${p.conf}</span></div></div>
    </div>
    <div class="stat-grid">
      <div class="sc"><div class="sc-lbl">Goals</div><div class="sc-val gold">${sum(ms,'goals')}</div></div>
      <div class="sc"><div class="sc-lbl">Assists</div><div class="sc-val blue">${sum(ms,'assists')}</div></div>
      <div class="sc"><div class="sc-lbl">Matches</div><div class="sc-val">${ms.length}</div></div>
      <div class="sc"><div class="sc-lbl">Shots/g</div><div class="sc-val">${avg(ms,'shots').toFixed(1)}</div></div>
      <div class="sc"><div class="sc-lbl">Passes/g</div><div class="sc-val">${Math.round(avg(ms,'passes'))}</div></div>
      <div class="sc"><div class="sc-lbl">Avg Rtg</div><div class="sc-val">${avgR}</div></div>
    </div>
  </div>`;
}

function barsHTML(p1,p2){
  const stats=[
    {l:'Goals (total)',k:'goals',max:12,s:true},{l:'Assists (total)',k:'assists',max:8,s:true},
    {l:'Shots / game',k:'shots',max:8},{l:'Passes / game',k:'passes',max:95},
    {l:'Dribbles / game',k:'dribbles',max:10},{l:'Avg rating',k:'rating',max:10}
  ];
  return stats.map(s=>{
    const v1=s.s?sum(p1.matches,s.k):parseFloat(avg(p1.matches,s.k).toFixed(1));
    const v2=s.s?sum(p2.matches,s.k):parseFloat(avg(p2.matches,s.k).toFixed(1));
    const mx=Math.max(s.max,v1,v2)*1.05;
    return`<div class="bar-row">
      <span class="bar-val bvl">${v1}</span>
      <div class="bar-center"><div class="bar-lbl">${s.l}</div>
        <div class="bbar"><div class="bl" style="width:${(v1/mx*100).toFixed(0)}%"></div><div class="br2" style="width:${(v2/mx*100).toFixed(0)}%"></div></div>
      </div>
      <span class="bar-val bvr">${v2}</span>
    </div>`;
  }).join('');
}

function tableHTML(p1,p2){
  const all=[...new Set([...p1.matches.map(m=>m.match),...p2.matches.map(m=>m.match)])];
  const rows=all.map(m=>{
    const a=p1.matches.find(x=>x.match===m),b=p2.matches.find(x=>x.match===m);
    const rc1=a?`<span class="${a.result==='W'?'win':a.result==='D'?'draw':'loss'}">${a.result}</span>`:'—';
    const rc2=b?`<span class="${b.result==='W'?'win':b.result==='D'?'draw':'loss'}">${b.result}</span>`:'—';
    return`<tr><td>${m}</td><td>${rc1}</td><td>${a?a.goals:'—'}</td><td>${a?a.assists:'—'}</td><td>${a?a.rating:'—'}</td><td class="sep-col">${rc2}</td><td>${b?b.goals:'—'}</td><td>${b?b.assists:'—'}</td><td>${b?b.rating:'—'}</td></tr>`;
  }).join('');
  return`<div style="overflow-x:auto"><table class="match-table"><thead>
    <tr><th style="width:90px">Match</th><th colspan="4" style="color:#3b82f6">${p1.name.split(' ').slice(-1)[0]}</th><th colspan="4" style="color:#ef4444;border-left:1px solid var(--border)" class="sep-col">${p2.name.split(' ').slice(-1)[0]}</th></tr>
    <tr><th></th><th>Res</th><th>G</th><th>A</th><th>Rtg</th><th class="sep-col">Res</th><th>G</th><th>A</th><th>Rtg</th></tr>
  </thead><tbody>${rows}</tbody></table></div>`;
}

function buildRadar(p1,p2){
  if(rC)rC.destroy();
  const d1=[avg(p1.matches,'goals'),avg(p1.matches,'assists'),avg(p1.matches,'shots'),avg(p1.matches,'passes')/10,avg(p1.matches,'dribbles'),avg(p1.matches,'rating')].map(v=>parseFloat(v.toFixed(2)));
  const d2=[avg(p2.matches,'goals'),avg(p2.matches,'assists'),avg(p2.matches,'shots'),avg(p2.matches,'passes')/10,avg(p2.matches,'dribbles'),avg(p2.matches,'rating')].map(v=>parseFloat(v.toFixed(2)));
  rC=new Chart(document.getElementById('rc'),{type:'radar',data:{labels:['Goals','Assists','Shots','Passes÷10','Dribbles','Rating'],datasets:[
    {label:p1.name,data:d1,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.1)',pointBackgroundColor:'#3b82f6',borderWidth:2},
    {label:p2.name,data:d2,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.1)',pointBackgroundColor:'#ef4444',borderWidth:2,borderDash:[5,3]}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{ticks:{color:'#5a6a8a',font:{size:9},backdropColor:'transparent'},pointLabels:{color:'#8a9bbf',font:{size:11}},grid:{color:'rgba(255,255,255,0.06)'},angleLines:{color:'rgba(255,255,255,0.06)'}}}}});
}

function buildTrend(p1,p2){
  if(tC)tC.destroy();
  const labels=p1.matches.map(m=>m.match.replace('vs ',''));
  tC=new Chart(document.getElementById('tc'),{type:'line',data:{labels,datasets:[
    {label:p1.name,data:p1.matches.map(m=>m.rating),borderColor:'#3b82f6',pointBackgroundColor:'#3b82f6',borderWidth:2,tension:.35,backgroundColor:'rgba(59,130,246,0.05)',fill:true},
    {label:p2.name,data:p2.matches.map(m=>m.rating),borderColor:'#ef4444',pointBackgroundColor:'#ef4444',borderWidth:2,tension:.35,borderDash:[5,4],backgroundColor:'rgba(239,68,68,0.05)',fill:true}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:5,max:10,ticks:{color:'#5a6a8a',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}},x:{ticks:{color:'#5a6a8a',font:{size:10},maxRotation:30},grid:{display:false}}}}});
}

function legHTML(p1,p2){
  return`<div class="legend"><span><span class="ldot" style="background:#3b82f6"></span>${p1.name}</span><span><span class="ldot" style="background:#ef4444"></span>${p2.name}</span></div>`;
}

function render(){
  const f=getFiltered();
  document.getElementById('player-count').textContent=`${f.length} player${f.length!==1?'s':''} available`;
  const p1=selP[0],p2=selP[1];
  document.getElementById('pcards').innerHTML=cardHTML(p1,'p1')+cardHTML(p2,'p2');
  if(!p1||!p2){
    document.getElementById('cmp-area').innerHTML=`<div class="cmp-section"><div class="empty-cmp"><div class="ei2">⚡</div><p>Select two players above to compare their stats, ratings, and match history</p></div></div>`;
    return;
  }
  const leg=legHTML(p1,p2);
  document.getElementById('cmp-area').innerHTML=`
    <div class="cmp-section"><div class="cmp-title">Stat comparison</div>${leg}${barsHTML(p1,p2)}</div>
    <div class="cmp-section"><div class="cmp-title">Performance radar</div>${leg}<div class="chart-wrap"><canvas id="rc"></canvas></div></div>
    <div class="cmp-section"><div class="cmp-title">Match rating trend</div>${leg}<div class="chart-wrap"><canvas id="tc"></canvas></div></div>
    <div class="cmp-section"><div class="cmp-title">Match-by-match breakdown</div>${tableHTML(p1,p2)}</div>
  `;
  buildRadar(p1,p2);buildTrend(p1,p2);
}

initTeamSel();render();
</script>
